<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iKIS Asset Prototype</title>
<style>
/* Layout: one phone, centred; screens are the Figma frames and app screenshots, with invisible tap areas on top */
:root{--page:#e9edf2;--ring:#2a78d6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0d0f12;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0d0f12;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);margin:0;padding-inline:16px;padding-block:24px;display:flex;justify-content:center}
.phone{width:399px;max-width:100%;border-radius:48px;background:#000;padding:10px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.screen{position:relative;width:379px;max-width:100%;height:820px;border-radius:38px;overflow:hidden;background:#17191d}
.page{position:absolute;inset:0;display:flex;flex-direction:column}
.page[hidden]{display:none}
.page img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar{display:none}
.layer{position:relative}
.layer[hidden]{display:none}
.top,.nav{position:relative;flex:0 0 auto}
.hs{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;border-radius:10px}
.hs:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
@media (hover:hover){.hs:hover{background:rgba(255,255,255,.08)}}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;transform:translateY(100%);transition:transform .25s ease}
.sheet.on{transform:none}
@media (prefers-reduced-motion: reduce){.scrim,.sheet{transition:none}}
</style>
</head>

<script>
const pages=['asset','menu','margin','withdraw'];let stack=['asset'];
function show(p){pages.forEach(x=>document.getElementById('pg-'+x).hidden=x!==p);}
function closeSheets(){document.getElementById('scrim').classList.remove('on');document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on'));}
function go(p){closeSheets();if(p==='asset'){stack=['asset'];}else{stack.push(p);}show(p);}
function back(){closeSheets();if(stack.length>1)stack.pop();show(stack[stack.length-1]);}
function setExpanded(on){document.getElementById('asset-expanded').hidden=!on;document.getElementById('asset-collapsed').hidden=on;}
document.getElementById('screen').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a.startsWith('go:'))go(a.slice(3));
  else if(a==='back')back();
  else if(a==='expand')setExpanded(true);
  else if(a==='collapse')setExpanded(false);
  else if(a.startsWith('sheet:')){document.getElementById('scrim').classList.add('on');document.getElementById('sh-'+a.slice(6)).classList.add('on');}
  else if(a==='close')closeSheets();
});
document.getElementById('scrim').addEventListener('click',closeSheets);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheets();});
</script>
